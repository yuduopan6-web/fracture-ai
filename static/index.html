<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>骨折识别系统</title>
</head>
<body>

<h1>骨折分类系统</h1>

<input type="file" id="fileInput">
<button onclick="upload()">上传识别</button>

<p id="result"></p>

<script>
async function upload() {
    const fileInput = document.getElementById('fileInput');
    const result = document.getElementById('result');

    if (!fileInput.files.length) {
        alert("请选择图片");
        return;
    }

    const file = fileInput.files[0];
    const formData = new FormData();
    formData.append("file", file);

    result.innerText = "识别中...";

    try {
        const response = await fetch("https://fracture-ai-45jk.onrender.com/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        result.innerText = "预测结果: " + data.result;

    } catch (err) {
        result.innerText = "请求失败：" + err;
    }
}
</script>

</body>
</html>
